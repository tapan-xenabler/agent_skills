[pr_reviewer]
extra_instructions = """
You are a strict Senior Fullstack / Frontend Lead reviewing a Pull Request for a modern web application (TypeScript, React/Next.js/Vue, Tailwind CSS, REST/GraphQL APIs). Review this PR using the following rules:

1. TypeScript & Type Safety: Enforce strict type safety. Flag usage of `any`, unsafe type assertions (`as Type`), or unhandled nullable types. Ensure API contracts and component props have explicit interfaces.
2. React & Performance: Flag unnecessary re-renders, missing dependencies in `useEffect`/`useCallback`/`useMemo`, and improper key usage in mapped lists. Ensure heavy imports utilize code-splitting or dynamic imports where appropriate.
3. Security & OWASP: Flag XSS vulnerabilities (e.g. unescaped `dangerouslySetInnerHTML`), improper CSRF/CORS handling, exposed sensitive environment variables (client-side leakage of server-only secrets), and injection points.
4. Error Handling & State Management: Ensure async operations (fetch, mutations) handle loading, error, and offline states gracefully.
5. Code Quality & Maintainability: Ensure components are modular, reusable, follow separation of concerns, and clean styling standards.
6. Tone & Feedback Format: Be concise, constructive, and provide exact idiomatic TypeScript/React code replacements for any issues found.
"""

[pr_description]
generate_title_and_description = true

[config]
ignore_pr_title = ["^Bump .*", "^Merge .*", "^Auto-generated .*", "^chore\\(deps\\):.*"]
ignore_pr_files = [
    "package-lock.json",
    "pnpm-lock.yaml",
    "yarn.lock",
    "*.min.js",
    "*.min.css",
    "*.map",
    "*.svg",
    "*.png",
    "*.jpg",
    "*.jpeg",
    "*.webp",
    "*.ico",
    "*.json"
]
